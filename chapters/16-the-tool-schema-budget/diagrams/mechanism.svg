<svg class="scratch" viewBox="0 0 720 288" role="img" aria-label="16 The tool schema budget" data-draw="17.41">
<title>16 The tool schema budget</title>
<desc>Schemas cost tokens on every request, so a harness that advertises everything eventually cannot afford to speak. A tool mounted on demand stays mounted, because withdrawing one mid-conversation leaves a call the next request cannot answer.</desc>
